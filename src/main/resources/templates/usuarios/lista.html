<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <div class="cabecalho">
        <h1>Usuários</h1>
        <a class="botao" th:href="@{/usuarios/novo}">Novo usuário</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.nome}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.telefone}"></td>
            <td class="acoes">
                <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                <form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post"
                      onsubmit="return confirm('Excluir este usuário?')">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="4" class="vazio">Nenhum usuário cadastrado.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
