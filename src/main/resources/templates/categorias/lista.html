<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Categorias')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <div class="cabecalho">
        <h1>Categorias</h1>
        <a class="botao" th:href="@{/categorias/novo}">Nova categoria</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.nome}"></td>
            <td th:text="${categoria.descricao}"></td>
            <td class="acoes">
                <a th:href="@{/categorias/{id}/editar(id=${categoria.id})}">Editar</a>
                <form th:action="@{/categorias/{id}/excluir(id=${categoria.id})}" method="post"
                      onsubmit="return confirm('Excluir esta categoria?')">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="vazio">Nenhuma categoria cadastrada.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
