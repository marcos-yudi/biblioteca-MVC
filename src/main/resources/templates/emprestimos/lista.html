<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Empréstimos')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <div class="cabecalho">
        <h1>Empréstimos</h1>
        <a class="botao" th:href="@{/emprestimos/novo}">Novo empréstimo</a>
    </div>
    <table>
        <thead>
        <tr>
            <th>Livro</th>
            <th>Usuário</th>
            <th>Retirada</th>
            <th>Devolução</th>
            <th>Situação</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emprestimo : ${emprestimos}">
            <td th:text="${emprestimo.livro.titulo}"></td>
            <td th:text="${emprestimo.usuario.nome}"></td>
            <td th:text="${#temporals.format(emprestimo.dataRetirada, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(emprestimo.dataDevolucao, 'dd/MM/yyyy')}"></td>
            <td>
                <span th:if="${emprestimo.devolvido}" class="etiqueta ok">Devolvido</span>
                <span th:unless="${emprestimo.devolvido}" class="etiqueta alerta">Em aberto</span>
            </td>
            <td class="acoes">
                <a th:href="@{/emprestimos/{id}/editar(id=${emprestimo.id})}">Editar</a>
                <form th:action="@{/emprestimos/{id}/excluir(id=${emprestimo.id})}" method="post"
                      onsubmit="return confirm('Excluir este empréstimo?')">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(emprestimos)}">
            <td colspan="6" class="vazio">Nenhum empréstimo registrado.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
