<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Livro')}"></head>
<body>
<header th:replace="~{fragmentos :: menu}"></header>
<main class="container">
    <h1 th:text="${livro.id == null} ? 'Novo livro' : 'Editar livro'"></h1>
    <form class="formulario" th:action="@{/livros}" th:object="${livro}" method="post">
        <input type="hidden" th:field="*{id}">
        <label>Título
            <input type="text" th:field="*{titulo}" required>
        </label>
        <label>Autor
            <input type="text" th:field="*{autor}" list="lista-autores" required>
        </label>
        <datalist id="lista-autores">
            <option th:each="autor : ${autores}" th:value="${autor.nome}"></option>
        </datalist>
        <label>ISBN
            <input type="text" th:field="*{isbn}" required>
        </label>
        <label>Categoria
            <select th:field="*{categoria}">
                <option value="">Selecione</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria.nome}"
                        th:text="${categoria.nome}"></option>
            </select>
        </label>
        <div class="botoes">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao secundario" th:href="@{/livros}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
